apiVersion: apps/v1
kind: Deployment
metadata:
  name: msvc-gateway
  labels:
    app: msvc-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: msvc-gateway
  template:
    metadata:
      labels:
        app: msvc-gateway
    spec:
      containers:
        - name: msvc-gateway
          image: smcasco/sergio-gateway:1.3
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: CLIENTS_USUARIOS_URL
              value: "http://msvc-usuarios:8001"
            - name: CLIENTS_CURSOS_URL
              value: "http://msvc-cursos:8002"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: msvc-gateway
spec:
  selector:
    app: msvc-gateway
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP
