# Configuración del puerto y nombre de la aplicación
server.port=8001

# Datos de la aplicación
spring.application.name=msvc-usuarios

# Configuración de la base de datos
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/msvc_usuarios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuración del cliente Feign
clients.cursos.url=${CLIENTS_CURSOS_URL:http://localhost:8002}

# Configuración de logging
logging.level.org.hibernate.SQL=debug

# Resource Server - validacion JWT contra msvc-auth
# jwk-set-uri apunta directamente al JWKS de msvc-auth (evita problemas de discovery)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:http://localhost:9000/auth/oauth2/jwks}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URI:http://localhost:9000/auth}

# Debug JWT
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.oauth2=TRACE
logging.level.org.springframework.security.oauth2.server.resource=TRACE
logging.level.org.springframework.web=DEBUG
logging.level.com.sergio.msvc.usuarios=DEBUG
