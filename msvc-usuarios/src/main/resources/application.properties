# Configuración del puerto y nombre de la aplicación
server.port=8001

# Datos de la aplicación
spring.application.name=msvc-usuarios

# Configuración de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/msvc_usuarios?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.properties.database-platform=org.hibernate.dialect.MySQL8Dialect

# Configuración de logging
logging.level.org.hibernate.SQL=debug
