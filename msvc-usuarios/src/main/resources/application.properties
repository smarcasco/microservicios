# Configuraci?n del puerto y nombre de la aplicaci?n
server.port=8001

# Datos de la aplicaci?n
spring.application.name=msvc-usuarios

# Configuraci?n de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3307/msvc_usuarios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuraci?n del cliente Feign
clients.cursos.url=http://localhost:8002

# Configuraci?n de logging
logging.level.org.hibernate.SQL=debug

# Configuración OAuth2 Client
spring.security.oauth2.client.registration.usuarios-client.client-id=usuarios-client
spring.security.oauth2.client.registration.usuarios-client.client-secret=usuarios-secret-123
spring.security.oauth2.client.registration.usuarios-client.client-name=Usuarios Service
spring.security.oauth2.client.registration.usuarios-client.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.usuarios-client.redirect-uri=http://localhost:8001/login/oauth2/code/usuarios-client
spring.security.oauth2.client.registration.usuarios-client.scope=openid,profile,read,write

# OAuth2 Provider Configuration
spring.security.oauth2.client.provider.usuarios-client.issuer-uri=http://localhost:9000/auth
spring.security.oauth2.client.provider.usuarios-client.authorization-uri=http://localhost:9000/auth/oauth2/authorize
spring.security.oauth2.client.provider.usuarios-client.token-uri=http://localhost:9000/auth/oauth2/token
spring.security.oauth2.client.provider.usuarios-client.user-info-uri=http://localhost:9000/auth/userinfo
spring.security.oauth2.client.provider.usuarios-client.jwk-set-uri=http://localhost:9000/auth/oauth2/jwks
