version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-usuarios
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: msvc_usuarios
      MYSQL_USER: msvc_user
      MYSQL_PASSWORD: msvc_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - microservicios-network

  msvc-auth:
    image: smcasco/sergio-auth:latest
    container_name: msvc-auth
    ports:
      - "9000:9000"
    environment:
      - SPRING_PROFILES_ACTIVE=default
    networks:
      - microservicios-network

  msvc-usuarios:
    image: smcasco/sergio-usuarios:latest
    container_name: msvc-usuarios
    ports:
      - "8001:8001"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/msvc_usuarios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: msvc_user
      SPRING_DATASOURCE_PASSWORD: msvc_pass
      CLIENTS_CURSOS_URL: http://msvc-cursos:8002
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://msvc-auth:9000
    depends_on:
      - mysql
      - msvc-auth
    networks:
      - microservicios-network

networks:
  microservicios-network:
    external: true
    name: microservicios-network

volumes:
  mysql-data:
