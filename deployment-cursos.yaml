apiVersion: apps/v1
kind: Deployment
metadata:
  name: msvc-cursos
  labels:
    app: msvc-cursos
spec:
  replicas: 3
  selector:
    matchLabels:
      app: msvc-cursos
  template:
    metadata:
      labels:
        app: msvc-cursos
    spec:
      containers:
        - name: msvc-cursos
          image: smcasco/sergio-cursos:latest
          ports:
            - containerPort: 8002
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgresql:5432/msvc_cursos"
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATASOURCE_PASSWORD
              value: "123456"
            - name: CLIENTS_USUARIOS_URL
              value: "http://msvc-usuarios:8001"
          readinessProbe:
            tcpSocket:
              port: 8002
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8002
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: msvc-cursos
spec:
  selector:
    app: msvc-cursos
  ports:
    - port: 8002
      targetPort: 8002
      nodePort: 30082
  type: NodePort
