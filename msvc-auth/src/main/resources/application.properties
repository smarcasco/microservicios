spring.application.name=msvc-auth
server.port=9000
server.servlet.context-path=/auth

# URL del servicio de usuarios (configurable por variable de entorno)
msvc.usuarios.url=${MSVC_USUARIOS_URL:http://localhost:8001}

# Issuer URI del servidor de autorizacion (configurable por variable de entorno)
auth.issuer-uri=${AUTH_ISSUER_URI:http://localhost:9000/auth}
